[project]
name = "lb-lint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "johannespietsch", email = "4784765+johannespietsch@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=2.61.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "spacy>=3.8.16",
    "typer>=0.27.3",
]

[project.scripts]
lb-lint = "lb_lint:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
